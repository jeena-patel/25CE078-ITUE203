    form {

    fieldset {
        background-color: white;

    legend {
        color: #1565c0;

    input,
    select {

    select:focus {
        outline: none;
        border: 2px solid #1565c0;

    button {
        background-color: #1565c0;
        color: white;
        border: none;
        padding: 10px 25px;

        cursor: pointer;
    }

        background-color: #e65100;

```

</head>

<body>

<header>
    <center>
        <h1>🎓 StudentHub</h1>
        <p><strong>Welcome Back!</strong></p>

```
<hr>

<nav aria-label="Login Navigation">
    <center>
        <a href="index.html">🏠 Home</a> |

```

</header>

<main>

```
<center>
    <h2>🔐 StudentHub Login</h2>

    <p>Login to access your student portal.</p>

    <form action="dashboard.html" method="get">

        <fieldset>

            <legend><strong>🔑 Login Information</strong></legend>

            <p>
                <label for="email">
                    <strong>Email:</strong>
                </label>
                <br>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </p>

            <p>
                <label for="password">
                    <strong>Password:</strong>
                </label>
                <br>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </p>

            <p>
                <label for="role">
                    <strong>Login As:</strong>
                </label>
                <br>

                <select id="role" name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="admin">Admin</option>
                </select>
            </p>

            <br>

            <button type="submit">🔐 Login</button>

        </fieldset>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">
            <strong>Register Now →</strong>
        </a>
    </p>

</center>
```

</main>

<hr>

<footer>
    <center>
        <p>🎓 StudentHub | © 2026</p>
    </center>
</footer>

</body>
</html>
